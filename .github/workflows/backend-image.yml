name: backend-image

# main → :latest + :sha-<commit>   (the nightly auto-updater follows :latest)
# Multi-arch: arm64 (Apple Silicon, ARM servers) + amd64 (Intel/AMD PCs and servers).
# Each architecture builds natively on its own runner (no emulation: PyTorch and
# friends are slow under QEMU), pushes by digest, then one job publishes the tags
# as a single multi-arch image.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dfergo/laiuni-backend

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-arch tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:sha-${{ github.sha }}" \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Check
        run: docker buildx imagetools inspect "$IMAGE:sha-${{ github.sha }}"
