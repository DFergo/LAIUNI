services:
  hrdd-backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      # DATA_DIR = /app/data (Sprint 24 layout: config/, sessions/, campaigns/, deleted/).
      # Named volume (default — VPS/headless):
      - hrdd-data:/app/data
      # Bind mount alternative (local machine — files editable "a mano" in Finder):
      # comment the line above and use e.g.
      #   - /Users/you/hrdd-data:/app/data
    environment:
      - DEPLOYMENT_JSON_PATH=/app/config/deployment_backend.json
      # Installation-wide signing secret (≥ 32 chars, e.g. `openssl rand -hex 32`): used for
      # every signed frontend without its own secret. Same value as HRDD_BACKEND_SECRET on
      # those frontends. Optional — without it, signed frontends need their own secret.
      - HRDD_FRONTEND_SECRET=${HRDD_FRONTEND_SECRET:-}

volumes:
  hrdd-data:
